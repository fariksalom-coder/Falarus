# Sales CRM subdomain — isolated from main platform SPA.
# Point DNS: crm.falarus.uz → same VPS as falarus.uz
# Certbot: certbot --nginx -d crm.falarus.uz

server {
    listen 443 ssl;
    server_name crm.falarus.uz;

    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/crm.falarus.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.falarus.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ /\.(env|git) {
        deny all;
        return 403;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name crm.falarus.uz;
    return 301 https://$host$request_uri;
}
