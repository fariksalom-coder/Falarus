# Reference nginx site for falarus.uz (production: /etc/nginx/sites-available/falarus)
# Uploads (avatar, help chat, payments) need client_max_body_size above default 1m.

server {
    listen 443 ssl;
    server_name falarus.uz www.falarus.uz;

    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/falarus.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/falarus.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ /\.(env|git) {
        deny all;
        return 403;
    }

    location ^~ /api/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name falarus.uz www.falarus.uz;
    return 301 https://$host$request_uri;
}
